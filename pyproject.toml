[project]
name = "aitcal"
version = "0.1.0"
description = "A calibration + fairness-audit layer over one open-weight AI-text detector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "netcal==1.3.5",
    "scipy==1.14.1",
    # netcal -> torchvision -> pillow; pin to a version with prebuilt cp312
    # wheels so uv never falls back to a source build (which needs system jpeg).
    "pillow==10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitcal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: downloads a model on first run",
]
